name: Inference container

on:
  push:
    branches: [main]
    paths: ['kokoro-service/**', 'scripts/smoke-kokoro.py', '.github/workflows/inference.yml']
  pull_request:
    paths: ['kokoro-service/**', 'scripts/smoke-kokoro.py', '.github/workflows/inference.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build CPU inference image
        run: docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t article-reader-kokoro:ci kokoro-service
      - name: Verify real offline inference
        run: python3 scripts/smoke-kokoro.py article-reader-kokoro:ci
      - name: Publish GHCR inference image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-kokoro"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag article-reader-kokoro:ci "$image:sha-$GITHUB_SHA"
          docker tag article-reader-kokoro:ci "$image:stable"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:stable"
